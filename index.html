<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="theme-color" content="#050403" />
  <title>Rank da Fama</title>
  <link rel="stylesheet" href="style.css?v=20260906-1130" />
</head>
<body>
  <main class="app-shell">
    <section class="live-card" aria-label="Rank da Fama">
      <header class="hero"><h1>RANK DA FAM<span id="secretConnect" class="secret-a" role="button" tabindex="0" aria-label="Abrir conexão">A</span></h1></header>
      <section id="podium" class="podium" aria-label="Top 3"></section>
      <ol id="rankingList" class="ranking-list" aria-label="Posições 4 a 10"></ol>
    </section>
  </main>

  <div id="connectModal" class="connect-modal" hidden>
    <div class="connect-backdrop" data-close-connect></div>
    <section class="connect-panel" role="dialog" aria-modal="true" aria-labelledby="connectTitle">
      <button id="closeConnect" class="connect-close" type="button" aria-label="Fechar">×</button>
      <span class="connect-kicker">LIVE+</span>
      <h2 id="connectTitle">Conectar painel</h2>
      <p>Digite o código da partida gerado no Projeto Daniel.</p>
      <input id="panelCode" class="connect-code" inputmode="text" autocomplete="off" autocapitalize="characters" maxlength="9" placeholder="ABCD-EFGH" />
      <button id="connectPanel" class="connect-button" type="button">Conectar</button>
      <div id="panelStatus" class="connect-status">Offline</div>
    </section>
  </div>

  <script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>
  <script src="liveplus-game-session.js?v=20260906-1130"></script>
  <script src="app.js?v=20260906-1130"></script>
</body>
</html>
