<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="theme-color" content="#080706" />
  <title>Fama — Rank de Doadores</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app-shell">
    <section class="live-card" aria-label="Ranking de fama da live">
      <header class="hero">
        <p class="eyebrow">RANK DE</p>
        <h1>DOADORES</h1>
        <p class="subtitle">VOCÊS FAZEM ISSO POSSÍVEL</p>
      </header>

      <div class="period-tabs" role="tablist" aria-label="Período do ranking">
        <button class="period-tab active" data-period="all" role="tab">Fama</button>
        <button class="period-tab" data-period="today" role="tab">Hoje</button>
        <button class="period-tab" data-period="10d" role="tab">10 dias</button>
      </div>

      <section id="podium" class="podium" aria-label="Top 3"></section>

      <section class="ranking-section">
        <div class="ranking-head">
          <span>TOP 10</span>
          <span>PONTOS</span>
        </div>
        <ol id="rankingList" class="ranking-list"></ol>
      </section>

      <footer class="footer-note">GRATIDÃO SEMPRE</footer>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
